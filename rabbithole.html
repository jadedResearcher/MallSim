<html>

<head>
  <title>RabbitHole</title>
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="custom-slider.css">

  <link rel="icon" href="http://farragofiction.com/ZampanioSimEast/favicon.ico" />
  <meta name="description" content="You have important words. We have answers.">
  <style>
    video {
      max-width: 90%;
      max-height: 90%;
    }

    img {
      max-width: 90%;
      max-height: 90%;
    }

    .rules_toggle {
      position: fixed;
      left: 0px;
      top: 31px;
      z-index: 1000;
    }

    .rules_list {
      position: fixed;
      left: 0px;
      top: 62px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      z-index: 1000;
    }

    .hidden-rules {
      transform: translate(-1000px, 0px);
    }


    .rule {
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      background-color: rgb(238, 228, 202);
      position: relative;
      border: 1px solid black;
      padding-left: 13px;
      padding-right: 13px;
      border-left: none;
    }



    .active-rule {
      background-color: rgb(237, 210, 135);
    }
  </style>
  <script src="scripts/utils.js"></script>
  <script src="scripts/custom_utils.js"></script>
  <script src="scripts/data.js"></script>

  <script src="scripts/save_engine.js"></script>

  <script>
    let resultsEle;

    //runSecret(`DEAD`);
    //file name is relative because you can't use this to trick someone
    //into running virus javascript or whatever
    const runSecret = async (fileName) => {
      fileName = fileName.toLowerCase(); //all lowercase
      updateURLParams("importantWords=" + fileName)
      console.log("JR NOTE: runSecret being called", fileName)
      const body = document.querySelector("body");
      const scriptTag = document.createElement("script")
      scriptTag.src = `secrets/${fileName}.js`;
      scriptTag.onerror = () => {
        resultsEle.innerHTML = "haha whoops, that's not a real password, lulz"
      }
      scriptTag.onload = () => {
        if (!globalDataObject.passwordsDugInto) {
          globalDataObject.passwordsDugInto = [];
        }
        globalDataObject.passwordsDugInto.push(fileName);
        globalDataObject.passwordsDugInto = uniq(globalDataObject.passwordsDugInto);
        globalDataObject.fallenIntoRabbitHole = true;
        save("rabbit hole password found");
      }
      body.append(scriptTag);

    }

    const handleForm = () => {

    }

    window.onload = () => {

      const queryString = window.location.search;
      const urlParams = new URLSearchParams(queryString);

      const importantWords = urlParams.get('importantWords');

      const inputEle = document.querySelector("#input");
      const submitEle = document.querySelector("#submit");
      const formEle = document.querySelector("#form");

      formEle.osubmit = (e) => {
        e.preventDefault();
        runSecret(input.value);

        return false;
      }
      submitEle.onclick = (e) => {
        e.preventDefault();

        runSecret(input.value);
        return false;
      }

      resultsEle = document.querySelector("#results");

      load();
      if (!globalDataObject.fallenIntoRabbitHole) {
        globalDataObject.fallenIntoRabbitHole = true;
        save("fallen into rabbithole");
      }

      if (importantWords) {
        runSecret(importantWords);
        inputEle.value = importantWords;

      }
    }
  </script>

</head>


<body class="rabbit">
  <div id="container">
    <form id="form">
      <label>Do you know any Important Words?</label>
      <input id="input" placeholder="Place them here"></input>
      <button id="submit">Submit</button>
    </form>
    <br><br>
    <div style="padding: 31px" id="results"></div>

  </div>
  <script src="rules_spine.js"></script>

</body>

</html>
